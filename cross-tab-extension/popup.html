<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Tab Sync</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
      background: #111827;
      color: #e5e7eb;
    }

    header {
      background: linear-gradient(135deg, #1e3a5f 0%, #0f2440 100%);
      padding: 14px 16px;
      border-bottom: 1px solid #1e3a5f;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #60a5fa;
    }

    header .subtitle {
      font-size: 11px;
      color: #6b7280;
      margin-top: 2px;
    }

    section {
      padding: 14px 16px;
      border-bottom: 1px solid #1f2937;
    }

    section h2 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #6b7280;
      margin-bottom: 10px;
    }

    .btn-row { display: flex; gap: 8px; }

    button {
      flex: 1;
      padding: 9px 12px;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: filter 0.1s;
    }

    button:hover { filter: brightness(1.15); }
    button:active { filter: brightness(0.85); }

    .btn-blue { background: #2563eb; color: #fff; }
    .btn-gray { background: #1f2937; color: #9ca3af; }
    .btn-green { background: #16a34a; color: #fff; }
    .btn-red  { background: #7f1d1d; color: #fca5a5; }

    .status {
      font-size: 12px;
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      display: none;
    }
    .status.show { display: block; }
    .status.success { background: #14532d; color: #86efac; }
    .status.error   { background: #450a0a; color: #fca5a5; }

    .bookmark-list {
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    .bookmark-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px solid #1f2937;
    }
    .bookmark-item:last-child { border-bottom: none; }

    .bm-info { flex: 1; min-width: 0; }

    .bm-title {
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #e5e7eb;
    }

    .bm-url {
      font-size: 11px;
      color: #6b7280;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-open {
      flex: 0 0 auto;
      padding: 5px 10px;
      font-size: 11px;
      background: #1e3a5f;
      color: #93c5fd;
      border-radius: 5px;
      cursor: pointer;
      border: none;
    }
    .btn-open:hover { background: #2563eb; color: #fff; }

    .empty {
      text-align: center;
      color: #4b5563;
      font-size: 12px;
      padding: 20px 0;
      line-height: 1.7;
    }

    footer {
      padding: 10px 16px;
      background: #0d1117;
    }

    .hint {
      font-size: 11px;
      color: #374151;
      line-height: 1.5;
    }

    .hint strong { color: #4b5563; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>⇄ Cross-Device Tab Sync</h1>
    <div class="subtitle">Sync via Chrome Bookmarks</div>
  </div>
</header>

<!-- Mac → iPhone -->
<section>
  <h2>📤 Stuur naar iPhone</h2>
  <div class="btn-row">
    <button class="btn-blue" id="pushCurrent">Huidige tab</button>
    <button class="btn-gray" id="pushAll">Alle tabs</button>
  </div>
  <div class="status" id="pushStatus"></div>
</section>

<!-- iPhone → Mac -->
<section>
  <h2>📥 Van iPhone &nbsp;<span style="font-weight:400;text-transform:none;font-size:10px">(map "📲 Van iPhone" in Chrome)</span></h2>
  <div class="bookmark-list" id="bookmarkList">
    <div class="empty">Laden…</div>
  </div>
  <div class="btn-row">
    <button class="btn-green" id="openAll">Alles openen</button>
    <button class="btn-gray"  id="refresh">↻ Vernieuwen</button>
    <button class="btn-red"   id="clearAll">Wissen</button>
  </div>
</section>

<footer>
  <div class="hint">
    <strong>iPhone → Mac:</strong> Sla een pagina op in Chrome (☆) → map
    <em>"📲 Van iPhone"</em> → druk Vernieuwen.<br>
    <strong>Mac → iPhone:</strong> klik "Huidige tab", open daarna de bladwijzers in Chrome iOS.
  </div>
</footer>

<script src="popup.js"></script>
</body>
</html>
